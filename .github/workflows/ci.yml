name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend and Analytics
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://claimgraph:claimgraph@localhost:5432/claimgraph
      SESSION_SECRET: ci-only-session-secret-change-me
      DBT_HOST: localhost
      DBT_USER: claimgraph
      DBT_PASSWORD: claimgraph
      DBT_DATABASE: claimgraph
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: testpassword
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: claimgraph
          POSTGRES_USER: claimgraph
          POSTGRES_PASSWORD: claimgraph
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U claimgraph -d claimgraph"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/testpassword
        ports:
          - 7474:7474
          - 7687:7687

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend and analytics dependencies
        run: |
          pip install -e "./backend[dev]"
          pip install -r dbt/requirements.txt

      - name: Lint backend
        run: ruff check backend scripts

      - name: Apply database migrations
        run: alembic -c backend/alembic.ini upgrade head

      - name: Test backend
        run: pytest backend --cov=backend/app --cov-report=term-missing

      - name: Load analytics fixture
        run: python scripts/load_dbt_fixture.py

      - name: Validate dbt connection
        run: dbt debug --project-dir dbt --profiles-dir dbt

      - name: Build and test dbt models
        run: dbt build --project-dir dbt --profiles-dir dbt

      - name: Run deterministic risk rules
        run: python -m app.risk.cli

      - name: Verify deterministic fixture signals
        run: python scripts/verify_risk_fixture.py

      - name: Wait for Neo4j
        run: python scripts/wait_for_neo4j.py

      - name: Project and analyze graph
        run: python -m app.graph.cli --replace

      - name: Verify graph fixture
        run: python scripts/verify_graph_fixture.py

      - name: Train and score anomaly fixture
        run: python -m app.ml.cli --fixture-mode --contamination 0.25

      - name: Verify anomaly model fixture
        run: python scripts/verify_ml_fixture.py

      - name: Compose investigation cases
        run: python -m app.casework.cli

      - name: Verify case evidence fixture
        run: python scripts/verify_case_fixture.py

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend
        run: npm install

      - name: Lint frontend
        run: npm run lint

      - name: Test frontend
        run: npm run test

      - name: Build frontend
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run browser QA
        run: npm run e2e

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan committed files for high-risk secret patterns
        run: python scripts/security_scan.py

      - name: Install backend for dependency audit
        run: |
          pip install -e "./backend"
          pip install pip-audit

      - name: Audit Python dependencies
        run: pip-audit --local --skip-editable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Build frontend and check for backend secret names
        working-directory: frontend
        run: |
          npm run build
          if grep -R -E "SESSION_SECRET=|NEO4J_PASSWORD=|DATABASE_URL=" dist; then
            echo "Backend secret material marker found in frontend bundle"
            exit 1
          fi

      - name: Validate development Compose configuration
        run: docker compose -f docker-compose.yml config --quiet

      - name: Validate production Compose configuration
        env:
          CLAIMGRAPH_DOMAIN: claimgraph.example.test
          ACME_EMAIL: ci@example.test
          POSTGRES_PASSWORD: ci-postgres-password
          NEO4J_PASSWORD: ci-neo4j-password
          REDIS_PASSWORD: ci-redis-password
          SESSION_SECRET: ci-session-secret-with-more-than-32-characters
          MAIL_HOST: smtp.example.test
          MAIL_FROM: noreply@example.test
        run: docker compose -f docker-compose.production.yml config --quiet
