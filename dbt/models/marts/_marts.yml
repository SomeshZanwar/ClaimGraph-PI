version: 2

models:
  - name: fact_claim_lines
    description: "Canonical long-form Carrier claim lines at one row per source claim line."
    columns:
      - name: claim_line_record_id
        data_tests:
          - not_null
          - unique
      - name: claim_record_id
        data_tests:
          - not_null
      - name: line_number
        data_tests:
          - not_null
      - name: beneficiary_id
        data_tests:
          - not_null
      - name: claim_id
        data_tests:
          - not_null

  - name: fact_claims
    description: "Claim-level rollup derived from canonical Carrier claim lines."
    columns:
      - name: claim_record_id
        data_tests:
          - not_null
          - unique
      - name: beneficiary_id
        data_tests:
          - not_null
      - name: claim_id
        data_tests:
          - not_null
      - name: line_count
        data_tests:
          - not_null

  - name: dim_provider
    description: "Synthetic provider-level aggregate derived from Carrier line provider identifiers."
    columns:
      - name: provider_npi
        data_tests:
          - not_null
          - unique

  - name: mart_provider_claim_metrics
    description: "Provider claim-level operational metrics used as a foundation for later peer analysis."
    columns:
      - name: provider_npi
        data_tests:
          - not_null
          - unique
