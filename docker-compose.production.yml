services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      CLAIMGRAPH_DOMAIN: ${CLAIMGRAPH_DOMAIN:?Set CLAIMGRAPH_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/deployment/Caddyfile:/etc/caddy/Caddyfile:ro
      - claimgraph_caddy_data:/data
      - claimgraph_caddy_config:/config
    depends_on:
      - frontend
      - backend

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api/v1
        PUBLIC_BASE_URL: https://${CLAIMGRAPH_DOMAIN:?Set CLAIMGRAPH_DOMAIN}
        PUBLIC_BASE_URL: https://${CLAIMGRAPH_DOMAIN:?Set CLAIMGRAPH_DOMAIN}
    restart: unless-stopped
    expose:
      - "80"

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      FRONTEND_ORIGIN: https://${CLAIMGRAPH_DOMAIN:?Set CLAIMGRAPH_DOMAIN}
      FRONTEND_BASE_URL: https://${CLAIMGRAPH_DOMAIN:?Set CLAIMGRAPH_DOMAIN}
      DATABASE_URL: postgresql+psycopg://claimgraph:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/claimgraph
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD}
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/0
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
      MAIL_HOST: ${MAIL_HOST:?Set MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:?Set MAIL_FROM}
      MAIL_USE_TLS: ${MAIL_USE_TLS:-true}
      EMAIL_DELIVERY_MODE: smtp
      MLFLOW_TRACKING_URI: sqlite:////app/artifacts/mlflow.db
      MODEL_ARTIFACT_DIR: /app/artifacts/models
      LOG_LEVEL: INFO
    expose:
      - "8000"
    volumes:
      - claimgraph_artifacts:/app/artifacts
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy

  analytics:
    profiles: ["bootstrap"]
    build:
      context: .
      dockerfile: infra/docker/analytics.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://claimgraph:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/claimgraph
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
      DBT_HOST: postgres
      DBT_USER: claimgraph
      DBT_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      DBT_DATABASE: claimgraph
      MLFLOW_TRACKING_URI: sqlite:////workspace/artifacts/mlflow.db
      MODEL_ARTIFACT_DIR: /workspace/artifacts/models
    volumes:
      - claimgraph_artifacts:/workspace/artifacts
    depends_on:
      backend:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: claimgraph
      POSTGRES_USER: claimgraph
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - claimgraph_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claimgraph -d claimgraph"]
      interval: 10s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5.26-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD}
    volumes:
      - claimgraph_neo4j:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    volumes:
      - claimgraph_redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}

volumes:
  claimgraph_postgres:
  claimgraph_neo4j:
  claimgraph_redis:
  claimgraph_artifacts:
  claimgraph_caddy_data:
  claimgraph_caddy_config:
