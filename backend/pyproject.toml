[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "claimgraph-pi-backend"
version = "0.1.0"
description = "ClaimGraph PI FastAPI backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.5,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "alembic>=1.13,<2.0",
  "neo4j>=5.25,<6.0",
  "redis>=5.1,<6.0",
  "structlog>=24.4,<26.0",
  "httpx>=0.27,<1.0",
  "pyyaml>=6.0,<7.0",
  "networkx>=3.4,<4.0",
  "numpy>=2.1,<3.0",
  "scikit-learn>=1.6,<2.0",
  "joblib>=1.4,<2.0",
  "mlflow-skinny>=3.0,<4.0",
  "argon2-cffi>=23.1,<26.0",
  "email-validator>=2.2,<3.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-cov>=5.0,<7.0",
  "ruff>=0.6,<1.0",
  "mypy>=1.11,<2.0"
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
